name: Release

on:
  push:
    branches: [release]
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - name: Read the version
        run: echo "VERSION=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - run: npm run sync
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GLOU_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "GLOU_KEYSTORE_BASE64 is not set" >&2; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/glou-release.jks"
          echo "GLOU_KEYSTORE=$RUNNER_TEMP/glou-release.jks" >> "$GITHUB_ENV"
      - name: Build the signed APK
        working-directory: android
        env:
          GLOU_KEYSTORE_PASSWORD: ${{ secrets.GLOU_KEYSTORE_PASSWORD }}
          GLOU_KEY_ALIAS: ${{ secrets.GLOU_KEY_ALIAS }}
          GLOU_KEY_PASSWORD: ${{ secrets.GLOU_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "glou-${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk glou.apk
          rm -f "$RUNNER_TEMP/glou-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: glou-release-apk
          path: |
            glou.apk
            glou-${{ env.VERSION }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            glou.apk
            glou-${{ env.VERSION }}.apk
          generate_release_notes: true
      - name: Publish on the public download page
        uses: softprops/action-gh-release@v2
        with:
          repository: Nikpar005/glou-app
          token: ${{ secrets.GLOU_APP_TOKEN }}
          tag_name: ${{ env.VERSION }}
          name: Glou ${{ env.VERSION }}
          body: Κατέβασε το glou.apk από το κινητό σου, άνοιξέ το και πάτα Εγκατάσταση.
          files: |
            glou.apk
            glou-${{ env.VERSION }}.apk
